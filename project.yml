name: LYLLTH

options:
  bundleIdPrefix: net.nightshape
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

packages:
  NightshapeAudioEngine:
    path: ../nightshape-drumkit-ios/NightshapeAudioEngine

targets:
  LYLLTH:
    type: application
    platform: macOS
    sources:
      - path: LYLLTH
        excludes:
          - Resources
          - SynthCore/*.cpp
      # The synth core is always built optimised: Debug-speed C++ DSP would
      # make every Debug session sound and measure unlike the real thing.
      - path: LYLLTH/SynthCore/LYSynthCore.cpp
        compilerFlags: ["-O3"]
      - path: LYLLTH/Resources
        buildPhase: resources
      # DrumKit's FX state models and FX windows, compiled from the sibling
      # checkout so both apps draw and animate effects from one source.
      - path: ../nightshape-drumkit-ios/Models/CompressorModels.swift
        group: DrumKitShared
      - path: ../nightshape-drumkit-ios/Models/ReverbModels.swift
        group: DrumKitShared
      - path: ../nightshape-drumkit-ios/Models/SequencerModels.swift
        group: DrumKitShared
      - path: ../nightshape-drumkit-ios/Models/SignalBloomModels.swift
        group: DrumKitShared
      - path: ../nightshape-drumkit-ios/Views/Components/FXWindowViews.swift
        group: DrumKitShared
      - path: ../nightshape-drumkit-ios/Views/Components/FXWindowsMore.swift
        group: DrumKitShared
      - path: ../nightshape-drumkit-ios/Views/Components/CompressorWindowView.swift
        group: DrumKitShared
      - path: ../nightshape-drumkit-ios/Views/Components/ExperimentalFXNavigation.swift
        group: DrumKitShared
      - path: ../nightshape-drumkit-ios/Views/Components/ParameterResetTap.swift
        group: DrumKitShared
      - path: ../nightshape-drumkit-ios/Views/Components/EQEditOverlayView.swift
        group: DrumKitShared
      - path: ../nightshape-drumkit-ios/Views/Components/FilterPanelView.swift
        group: DrumKitShared
      - path: ../nightshape-drumkit-ios/Views/Components/SonicDecimatorEditorView.swift
        group: DrumKitShared
      # DrumKit's .fkit container, for opening and saving DrumKit projects.
      - path: ../nightshape-drumkit-ios/Services/ZipArchiveReader.swift
        group: DrumKitShared
      - path: ../nightshape-drumkit-ios/Services/ZipArchiveWriter.swift
        group: DrumKitShared
    dependencies:
      - package: NightshapeAudioEngine
        product: NightshapeAudioEngine
      - sdk: Accelerate.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.nightshape.lyllth
        PRODUCT_NAME: LYLLTH
        INFOPLIST_FILE: LYLLTH/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: LYLLTH/LYLLTH.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: LYLLTH/SynthCore/LYLLTH-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  LYLLTHTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LYLLTHTests
    dependencies:
      - target: LYLLTH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.nightshape.lyllth.tests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES

  # LUNATK as an Audio Unit: a container app and the AUv3 instrument
  # extension inside it. The extension compiles LYLLTH's synth, core and
  # theme from the same files, so the plug-in and LYLLTH never drift.
  LUNATK:
    type: application
    platform: macOS
    sources:
      - path: LUNATK/App
      - path: LYLLTH/Theme
      - path: LYLLTH/Resources/Fonts
        buildPhase: resources
    dependencies:
      - target: LUNATKExtension
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.nightshape.lunatk
        PRODUCT_NAME: LUNATK
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LUNATK
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_ENTITLEMENTS: LUNATK/App/LUNATK.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  LUNATKExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: LUNATK/Extension
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: LYLLTH/Synth
      - path: LYLLTH/Theme
      - path: LYLLTH/SynthCore
        excludes:
          - "*.cpp"
      - path: LYLLTH/SynthCore/LYSynthCore.cpp
        compilerFlags: ["-O3"]
      - path: LYLLTH/Resources/Fonts
        buildPhase: resources
    dependencies:
      - sdk: Accelerate.framework
      - sdk: CoreAudioKit.framework
      - sdk: AudioToolbox.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.nightshape.lunatk.audiounit
        PRODUCT_NAME: LUNATKExtension
        INFOPLIST_FILE: LUNATK/Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: LUNATK/Extension/LUNATKExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: LYLLTH/SynthCore/LYLLTH-Bridging-Header.h
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LUNATK_PLUGIN"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

schemes:
  LYLLTH:
    build:
      targets:
        LYLLTH: all
        LYLLTHTests: [test]
    test:
      targets:
        - LYLLTHTests
  LUNATK:
    build:
      targets:
        LUNATK: all
        LUNATKExtension: all
